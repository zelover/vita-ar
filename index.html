html<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  body { margin:0; overflow:hidden; font-family:sans-serif; }
  #lock-screen{
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:#111; z-index:9999; display:flex; 
    flex-direction:column; justify-content:center; align-items:center; color:white;
  }
  #lock-screen input{ padding:15px; font-size:18px; border-radius:8px; border:none; margin:10px; text-align:center; width:220px; }
  #lock-screen button{ padding:12px 30px; font-size:18px; background:#00aaff; color:white; border:none; border-radius:8px; cursor:pointer; }
  #error-msg{ color:#ff5555; margin-top:10px; display:none; }
</style>
</head>
<body>

<div id="lock-screen">
  <h2>Acces Prive VITA</h2>
  <input type="text" id="password-input" placeholder="Code Toto2026">
  <button onclick="checkPassword()">Entrer</button>
  <p id="error-msg">Code faux. Essaie toto2026</p>
</div>

<a-scene id="ar-scene" style="display:none;" mindar-image="imageTargetSrc: ./targets.mind; autoStart:false;" vr-mode-ui="enabled:false">
  <a-assets><video id="videoTexture" src="./video.mp4" loop muted playsinline crossorigin="anonymous"></video></a-assets>
  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
  <a-entity mindar-image-target="targetIndex:0">
    <a-video src="#videoTexture" position="0 0 0" height="1" width="1.5"></a-video>
  </a-entity>
</a-scene>

<script>
  const CODE_SECRET = "toto2026";
  function checkPassword(){
    const input = document.getElementById('password-input').value.trim().toLowerCase();
    if(input === CODE_SECRET){
      localStorage.setItem('vita_access','true');
      unlock();
    } else {
      document.getElementById('error-msg').style.display='block';
    }
  }
  function unlock(){
    document.getElementById('lock-screen').style.display='none';
    document.getElementById('ar-scene').style.display='block';
    document.getElementById('ar-scene').systems["mindar-image-system"].start();
    const video = document.getElementById('videoTexture');
    document.querySelector('[mindar-image-target]').addEventListener("targetFound", ()=>{ video.play(); });
  }
  if(localStorage.getItem('vita_access')==='true'){ unlock(); }
</script>
</body>
</html>
